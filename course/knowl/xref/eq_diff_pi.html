\begin{align}
\cos\left(\pi-\theta\right)
&amp;=
\cos\left(\pi\right)
\cos\left(\theta\right)
+
\sin\left(\pi\right)
\sin\left(\theta\right)\tag{8}\\
&amp;=
-1\cdot
\cos\left(\theta\right)
+
0\cdot
\sin\left(\theta\right)\notag\\
&amp;=
-\cos\left(\theta\right)\notag
\end{align}
